server:
  port: 8084
  shutdown: GRACEFUL

spring:
  application:
    name: ollama-llama3
  ai:
    vectorstore:
      pgvector:
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 4096
        initialize-schema: true
        remove-existing-vector-store-table: true
    ollama:
      base-url: http://localhost:11434/
      embedding:
        enabled: true
        model: llama3
        options:
          model: llama3
      chat:
        enabled: true
        model: llama3
        options:
          model: llama3
  datasource:
    url: jdbc:postgresql://localhost:5432/vector_store
    username: postgres
    password: postgres
    jpa:
      show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

pdf:
  path: classpath:Shiva_Java_Developer.pdf